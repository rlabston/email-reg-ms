# Test-specific properties - use in-memory H2 so tests don't require MySQL or its driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create and drop the schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Use H2 in-memory during tests; Hibernate will auto-detect the dialect from the JDBC URL
# Avoid forcing a dialect here so we keep the same behaviour as production code where
# the dialect is auto-detected unless explicitly overridden by a profile.

# Don't run Flyway in tests; let JPA create-drop handle schema for the ephemeral H2 DB
spring.flyway.enabled=false

# JWT test defaults
app.jwt.secret=dev-test-secret-please-change-32chars!
app.jwt.expiration-ms=3600000

# MindsDB defaults for tests - point to localhost (not required to be running for unit tests that mock the service)
mindsdb.api.url=http://localhost:47334
mindsdb.api.timeout=30000
