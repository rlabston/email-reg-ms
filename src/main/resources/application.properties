spring.application.name=email-registration-service

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration
# For production, set these via environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/email_reg_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:emailapp}
spring.datasource.password=${DB_PASSWORD:emailapp123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Flyway (MySQL 8.4 not recognized by Flyway; JPA ddl-auto handles schema)
spring.flyway.enabled=false

# MindsDB Configuration
# OPTION 1: Local MindsDB (ACTIVE - running via Python)
mindsdb.api.url=${MINDSDB_API_URL:http://localhost:47334}

# OPTION 2: MindsDB Cloud (alternative - requires API key)
# Sign up at https://cloud.mindsdb.com (free tier available)
# mindsdb.api.url=https://cloud.mindsdb.com

# OPTION 3: Docker MindsDB (if using Docker Desktop)
# mindsdb.api.url=http://localhost:47334

mindsdb.api.timeout=${MINDSDB_API_TIMEOUT:30000}

# MindsDB Cloud Authentication (set ONE of these methods)
# 1. API Key authentication (preferred)
# mindsdb.api.key=${MINDSDB_API_KEY:}

# 2. Basic email/password authentication (avoid for production; use API key)
# mindsdb.cloud.email=${MINDSDB_CLOUD_EMAIL:}
# mindsdb.cloud.password=${MINDSDB_CLOUD_PASSWORD:}

# You can also set these via environment variables:
# export MINDSDB_API_KEY=xxxx
# export MINDSDB_CLOUD_EMAIL=you@example.com
# export MINDSDB_CLOUD_PASSWORD=secret

# Security Configuration
# Note: All endpoints are publicly accessible (no authentication required)
# These settings are kept for password encoding in the application
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin123}
