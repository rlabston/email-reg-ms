spring.application.name=email-registration-service

# Server Configuration
server.port=8081
# Do not set a global servlet context-path so the frontend can be served at /
# REST APIs are exposed under the `/api` path via controller-level mappings.
#server.servlet.context-path=/api
# Bind server to localhost only to avoid exposing dev server to the network and
# reduce interference with local development tools (e.g., VS Code extensions)
server.address=127.0.0.1

# Database configuration
# Production/Development MySQL credentials are read from environment variables to
# avoid committing secrets into version control. For local development you can
# continue to use default values below or override them with env vars.
# Recommended env vars (set in CI or your shell / service manager):
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# Example to run with MySQL profile:
#   export SPRING_DATASOURCE_URL=jdbc:mysql://host:3306/email_reg_db
#   export SPRING_DATASOURCE_USERNAME=myuser
#   export SPRING_DATASOURCE_PASSWORD=mysecret
#   ./gradlew bootRun -Dspring.profiles.active=mysql

# Use environment variables when present; fall back to sensible local defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/email_reg_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:emailapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:emailapp123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# NOTE: Do not set a global Hibernate dialect here. Let Hibernate auto-detect
# the dialect for the active datasource (H2 for tests, MySQL for production).
# If you need to force MySQL in a MySQL deployment, create a profile-specific
# properties file (e.g. application-mysql.properties) and put the dialect there.

# Disable Flyway (MySQL 8.4 not recognized by Flyway; JPA ddl-auto handles schema)
spring.flyway.enabled=false

# MindsDB Configuration
# OPTION 1: Local MindsDB (ACTIVE - running via Python)
mindsdb.api.url=http://localhost:47334

# OPTION 2: MindsDB Cloud (alternative - requires API key)
# Sign up at https://cloud.mindsdb.com (free tier available)
# mindsdb.api.url=https://cloud.mindsdb.com

# OPTION 3: Docker MindsDB (if using Docker Desktop)
# mindsdb.api.url=http://localhost:47334

mindsdb.api.timeout=30000

# MindsDB Cloud Authentication (set ONE of these methods)
# 1. API Key authentication (preferred)
# mindsdb.api.key=YOUR_CLOUD_API_KEY

# 2. Basic email/password authentication (avoid for production; use API key)
# mindsdb.cloud.email=your-email@example.com
# mindsdb.cloud.password=your-strong-password

# You can also set these via environment variables:
# export MINDSDB_API_KEY=xxxx
# export MINDSDB_CLOUD_EMAIL=you@example.com
# export MINDSDB_CLOUD_PASSWORD=secret

# Security - Test User (CHANGE IN PRODUCTION!)
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT (development defaults)
app.jwt.secret=dev-secret-change-me-at-least-32-chars-1234567890abcdef
app.jwt.expiration-ms=3600000
