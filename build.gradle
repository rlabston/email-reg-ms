plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    // Centralize Kotlin and KSP plugin versions for subprojects. Using the latest
    // published plugin versions available on Maven Central as of this check.
    id 'org.jetbrains.kotlin.jvm' version '2.2.0' apply false
    id 'com.google.devtools.ksp' version '2.2.0-2.0.2' apply false
}

group = 'com.technet7.microsvc'
version = '0.0.1-SNAPSHOT'
description = 'Email Registration Microservice'

java {
    toolchain {
        // Use Java 25 for compilation (migrating project to Java 25 per request)
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // JWT support for stateless auth to back the SPA
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.flywaydb:flyway-core:10.17.1'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.security:spring-security-test'
}

// Import Spring Cloud BOM so subprojects can use Spring Cloud starters with compatible versions
dependencyManagement {
    imports {
        // Use the Spring Cloud release train compatible with Spring Boot 3.5.x
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.0'
    }
}

test {
    useJUnitPlatform()
    jvmArgs = [
        "-XX:+EnableDynamicAgentLoading"
    ]
}

springBoot {
    // Correct main class for the application entrypoint
    // The main class is defined in src/main/java/com/technet7/microsvc/email/RegisterEmail.java
    mainClass = 'com.technet7.microsvc.email.RegisterEmail'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Enable deprecation linting for test compilation so we can find and fix deprecated API usages.
// This adds -Xlint:deprecation to the test compile task without changing production compile behavior.
tasks.named('compileTestJava') {
    // Gradle exposes the JavaCompile task type; add compiler args to this specific task
    if (it.hasProperty('options')) {
        it.options.compilerArgs = (it.options.compilerArgs ?: []) + ['-Xlint:deprecation']
    }
}

// Include compiled frontend files (if present) into the Spring Boot jar resources
// so they are served from the same origin as the backend.
def frontendBrowserDir = file("${projectDir}/web-frontend/dist/web-frontend/browser")
if (frontendBrowserDir.exists()) {
    processResources {
        // Copy files from web-frontend build output into classpath:/static so Spring Boot serves them
        from(frontendBrowserDir) {
            into 'static'
        }
    }
} else {
    logger.lifecycle("Frontend build not found at: ${frontendBrowserDir}. Skipping copy into classpath:/static.\nTo include the frontend, run the frontend build (e.g. `cd web-frontend && npm run build`) before building the backend.")
}
