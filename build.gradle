plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.technet7.microsvc'
version = '0.0.1-SNAPSHOT'
description = 'Email Registration Microservice'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.flywaydb:flyway-core:10.17.1'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
}

test {
    useJUnitPlatform()
    jvmArgs = [
        "-XX:+EnableDynamicAgentLoading"
    ]
}

springBoot {
    // Correct main class for the application entrypoint
    // The main class is defined in src/main/java/com/technet7/microsvc/email/RegisterEmail.java
    mainClass = 'com.technet7.microsvc.email.RegisterEmail'
}

tasks.named('test') {
    useJUnitPlatform()
}
