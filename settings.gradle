pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // Provide Android Gradle plugin version for subprojects
        // Bump AGP to a newer 8.x release to address deprecation warnings
        // (will improve compatibility with newer Gradle versions)
        // Try a newer AGP patch release; this can reduce internal deprecation warnings
        id 'com.android.application' version '8.3.0'
        id 'com.android.library' version '8.3.0'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'email-reg-ms'
// Allow skipping the Android subproject during backend/CI builds by setting
// the environment variable SKIP_ANDROID_BUILD=true. This is useful when
// you only need to build/run the backend and want to avoid Android Gradle
// Plugin internal deprecation warnings (or long Android toolchain downloads).
def skipAndroid = System.getenv('SKIP_ANDROID_BUILD') == 'true'
if (!skipAndroid) {
    include ':android-client'
} else {
    logger.lifecycle("Skipping include ':android-client' because SKIP_ANDROID_BUILD=true")
}
include ':gateway'