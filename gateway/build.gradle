plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.technet7.microsvc'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Use WebFlux (reactive) stack for Spring Cloud Gateway
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Spring Cloud Gateway for routing and filters
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // no heavy extra dependencies beyond Spring Cloud Gateway
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Import Spring Cloud BOM so the starter version for gateway is resolved
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.0'
    }
}

test {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.technet7.microsvc.gateway.GatewayApplication'
}
