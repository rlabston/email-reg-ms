<!doctype html>
<html lang="en" data-beasties-container="">
<head>
  <meta charset="utf-8">
  <title>WebFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Wire up the static fallback's interactivity: password toggle and login POST
    (function(){
      try {
        function init() {
          var toggle = document.getElementById('static-toggle');
          var pwd = document.getElementById('static-password');
          var btn = document.getElementById('static-login-btn');
          var email = document.getElementById('static-email');
          var err = document.getElementById('static-error');
          if (!btn || !email || !pwd) return;

          toggle && toggle.addEventListener('click', function(e){
            try {
              if (pwd.type === 'password') { pwd.type = 'text'; toggle.textContent = '🙈'; }
              else { pwd.type = 'password'; toggle.textContent = '👁️'; }
            } catch(e){ }
          });

          btn.addEventListener('click', function(){
            (async function(){
              try {
                console.log('[static-login] submit clicked');
                btn.disabled = true;
                err.style.display = 'none';
                var em = (email.value || '').trim();
                var pw = (pwd.value || '').trim();
                if (!em || !pw) {
                  err.textContent = 'Please enter email and password';
                  err.style.display = 'block';
                  btn.disabled = false;
                  return;
                }
                console.log('[static-login] posting to backend', em);
                var res;
                try {
                  res = await fetch('/api/emails/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: em, password: pw }),
                    // no credentials by default; backend is configured for CORS from localhost
                  });
                } catch (networkErr) {
                  console.error('[static-login] fetch network error', networkErr);
                  err.textContent = 'Network error: ' + (networkErr && networkErr.message || '');
                  err.style.display = 'block';
                  return;
                }

                // If the dev/static server isn't proxying /api (e.g. when serving prebuilt assets),
                // it may answer 404/501/etc. In those cases try the backend directly as a fallback.
                // Direct backend calls may be subject to CORS in some setups; the backend here allows
                // requests from localhost during development, so this is a pragmatic fallback for devs.
                if (res && (res.status === 404 || res.status === 501 || res.status === 405)) {
                  try {
                    console.warn('[static-login] received non-proxied response (' + res.status + ') from dev/static server; trying direct backend');
                    // visible banner so the developer knows we are falling back to direct backend
                    try {
                      var fb = document.getElementById('static-backend-fallback');
                      if (!fb) {
                        fb = document.createElement('div');
                        fb.id = 'static-backend-fallback';
                        fb.style.position = 'fixed';
                        fb.style.left = '50%';
                        fb.style.top = '8px';
                        fb.style.transform = 'translateX(-50%)';
                        fb.style.zIndex = 10002;
                        fb.style.background = '#ff9800';
                        fb.style.color = '#111';
                        fb.style.padding = '8px 12px';
                        fb.style.borderRadius = '6px';
                        fb.style.boxShadow = '0 6px 18px rgba(0,0,0,0.12)';
                        fb.textContent = 'Dev/static server returned ' + res.status + ' — trying backend directly (127.0.0.1:8080)';
                        document.body.appendChild(fb);
                        // auto-dismiss after a short period
                        setTimeout(function(){ try { fb.parentNode && fb.parentNode.removeChild(fb); } catch(e){} }, 6000);
                      }
                    } catch(e) { /* ignore banner errors */ }

                    // Fall back to the gateway at 127.0.0.1:8080 (the frontend should use the gateway).
                    res = await fetch('http://127.0.0.1:8080/api/emails/login', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ email: em, password: pw })
                    });
                  } catch (backendErr) {
                    console.error('[static-login] direct backend fetch failed', backendErr);
                    err.textContent = 'Network error: ' + (backendErr && backendErr.message || '');
                    err.style.display = 'block';
                    try { btn.disabled = false; } catch(_){}
                    return;
                  }
                }

                console.log('[static-login] response status', res.status);
                if (res.ok) {
                  // try to read JSON if present
                  var body = null;
                  try { body = await res.json(); } catch(e) { /* ignore JSON parse errors */ }
                  try {
                    localStorage.setItem('auth_email', em);
                    if (body && body.username) localStorage.setItem('auth_username', body.username);
                  } catch(e) { console.warn('[static-login] localStorage set failed', e); }

                  // show a small success notice (outside the static login box so it survives small DOM changes)
                  try {
                    var success = document.createElement('div');
                    success.id = 'static-success';
                    success.style.position = 'fixed';
                    success.style.right = '16px';
                    success.style.top = '16px';
                    success.style.background = '#2e7d32';
                    success.style.color = 'white';
                    success.style.padding = '10px 14px';
                    success.style.borderRadius = '6px';
                    success.style.zIndex = 10001;
                    success.textContent = (body && body.message) ? (body.message + ' — redirecting...') : 'Login successful — redirecting...';
                    document.body.appendChild(success);
                  } catch(e){ console.warn('[static-login] could not show success notice', e); }

                  // short delay so user can see the notification, then navigate.
                  // Use a more robust navigation attempt sequence (replace -> href -> assign)
                  (function(){
                    var target = '/';
                    var attempts = 0;
                    var maxAttempts = 10;
                    function tryNav() {
                      attempts++;
                      try {
                        // preferred: replace (no history entry)
                        window.location.replace(target);
                        return;
                      } catch(e) { /* ignore */ }
                      try {
                        // fallback: href
                        window.location.href = target;
                        return;
                      } catch(e) { /* ignore */ }
                      try {
                        // last resort: assign
                        window.location.assign(target);
                        return;
                      } catch(e) { /* ignore */ }
                      if (attempts < maxAttempts) {
                        setTimeout(tryNav, 200);
                      } else {
                        // final fallback: reload the page to encourage a navigation
                        try { window.location.reload(); } catch(e) { /* give up */ }
                      }
                    }
                    // small initial delay so the toast is visible
                    setTimeout(tryNav, 350);
                  })();
                  return;
                }

                var text = 'Login failed';
                try { var body = await res.json(); if (body) text = body.error || body.message || text; } catch(e){}
                err.textContent = text;
                err.style.display = 'block';
              } catch(e) {
                console.error('[static-login] unexpected error', e);
                try { err.textContent = 'Unexpected error'; err.style.display = 'block'; } catch(_){}
              } finally { try { btn.disabled = false; } catch(_){} }
            })();
          });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
      } catch(e){}
    })();
  </script>
  <script>
    // If the server incorrectly rendered the App redirect message for /login,
    // replace it with a minimal static login form so the page is usable
    // while the client-side app hydrates.
    (function(){
      try {
        if (typeof window === 'undefined' || typeof document === 'undefined') return;
        console.log('[pre-bootstrap] login-fallback script running');
        var p = window.location && window.location.pathname;
        function replaceIfNeeded() {
          try {
            var root = document.querySelector('app-root');
            if (!root) return;
            // Avoid replacing app-root's internal DOM (this breaks Angular hydration).
            // Instead, show the pre-existing `#static-login` overlay when we detect
            // the server-rendered "Redirecting to login" placeholder on /login.
            if (p === '/login' && /Redirecting to login/.test(root.innerText || '')) {
              try {
                document.getElementById('static-login').style.display = 'flex';
                console.warn('[pre-bootstrap] static-login overlay shown because server rendered a redirect placeholder on', p);
              } catch(e){}
            }
          } catch (e) { /* ignore */ }
        }
        if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', function() { replaceIfNeeded();
                });
    } else {
      replaceIfNeeded();
    }
      } catch (e) { /* ignore */ }
    })();
  </script>

<body ngcm="">
  <!-- Static fallback login visible immediately for /login to avoid SSR hydration gaps -->
  <div id="static-login" style="display:none;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10000;">
    <div style="background:white;padding:24px;border-radius:8px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.15);">
      <h2 style="margin-top:0;margin-bottom:16px;">Email Registration Login</h2>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <input id="static-email" placeholder="Enter your email" style="padding:10px;border:1px solid #ddd;border-radius:4px;">
        <div style="position:relative;">
          <input id="static-password" type="password" placeholder="Enter your password" style="padding:10px;border:1px solid #ddd;border-radius:4px;width:100%;">
          <button id="static-toggle" aria-label="Toggle password" style="position:absolute;right:6px;top:6px;border:none;background:transparent;font-size:18px;cursor:pointer;">👁️</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="static-login-btn" style="padding:10px;background:#4CAF50;color:white;border:none;border-radius:4px;">Login</button>
          <div id="static-error" style="color:#c62828;font-size:13px;display:none;"></div>
        </div>
      </div>
    </div>
  </div>
  <app-root></app-root>
  <script>
    // Remove the static fallback once the SPA has hydrated or replaced the markup
    (function(){
      try {
        var attempts = 0;
        var max = 200; // ~20s - give SPA more time to hydrate in slow environments
        var id = setInterval(function(){
          attempts++;
          try {
            var root = document.querySelector('app-root');
            var staticLogin = document.getElementById('static-login');
            if (!staticLogin) { clearInterval(id); return; }
            // If SPA rendered a form or a router-outlet (indicating the app booted), hide the static fallback
            var hydrated = false;
            if (root && root.querySelector) {
              if (root.querySelector('form')) hydrated = true;
              if (root.querySelector('router-outlet')) hydrated = true;
            }
            if (hydrated) {
              try { staticLogin.style.display = 'none'; } catch(e){}
              console.log('[pre-bootstrap] static-login overlay hidden after SPA rendered');
              clearInterval(id);
              return;
            }
            if (attempts > max) { clearInterval(id); }
          } catch(e){ clearInterval(id); }
        }, 100);
      } catch(e){}
    })();
  </script>

</html>
