<div class="app-shell">
  <div class="header-bar">
    <div class="header-left">
      <button type="button" class="hamburger-menu" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h3>{{ welcomeMessage() }}</h3>
    </div>
    <button *ngIf="authed()" type="button" class="logout-button" (click)="logout($event)">Logout</button>
  </div>

  <!-- Hamburger Menu Dropdown -->
  <div class="menu-dropdown" [class.active]="menuOpen()">
    <div class="menu-items">
      <button type="button" class="menu-item" (click)="navigateTo('/')">
        <span class="menu-icon">🏠</span>
        <span class="menu-text">Home</span>
      </button>
      <button type="button" class="menu-item" (click)="navigateTo('/register')">
        <span class="menu-icon">📧</span>
        <span class="menu-text">Email Registration</span>
      </button>
      <button type="button" class="menu-item" *ngIf="!authed()" (click)="navigateTo('/login')">
        <span class="menu-icon">🔐</span>
        <span class="menu-text">Login</span>
      </button>
      <button type="button" class="menu-item" *ngIf="authed()" (click)="navigateTo('/chatbot')">
        <span class="menu-icon">💬</span>
        <span class="menu-text">AI Chatbot</span>
      </button>
      <button type="button" class="menu-item" *ngIf="isAdmin()" (click)="navigateTo('/emails')">
        <span class="menu-icon">📋</span>
        <span class="menu-text">View All Emails</span>
      </button>
    </div>
  </div>

  <div class="content-area">
    <router-outlet />
  </div>
</div>
